name: validate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned runtime dependency
        run: npm install --no-audit --no-fund
      - name: Build Pages artifact
        run: npm run build
      - name: Validate
        run: npm test
      - name: Headless Three.js smoke
        run: npm run smoke
